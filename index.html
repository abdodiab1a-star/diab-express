<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DIAB EXPRESS | دياب إكسبريس للشحن والخدمات اللوجستية</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy-950: #060e1a;
      --navy-900: #0b192c;
      --navy-800: #11243d;
      --navy-700: #1e3a8a;
      --fire-500: #f97316;
      --fire-600: #ea580c;
      --fire-400: #fb923c;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-600: #475569;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Cairo", sans-serif;
      background: var(--slate-50);
      color: var(--navy-900);
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .hidden { display: none !important; }

    /* Toast */
    #toast-container {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 360px;
      width: calc(100% - 32px);
      pointer-events: none;
    }
    .toast-msg {
      padding: 12px 16px;
      border-radius: 14px;
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
      background: var(--navy-900);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .toast-success { background: #059669; border-color: #10b981; }
    .toast-error { background: #dc2626; border-color: #f87171; }

    /* Top Header & Switcher */
    header.site-header {
      position: fixed;
      top: 0;
      inset-inline: 0;
      z-index: 1000;
      background: rgba(11, 25, 44, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .switcher-bar {
      background: var(--navy-950);
      border-bottom: 1px solid rgba(249, 115, 22, 0.35);
      padding: 8px 16px;
    }
    .switcher-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #34d399;
      margin-left: 6px;
    }
    .mode-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .mode-btn {
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      font-family: inherit;
      font-weight: 800;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 10px;
      cursor: pointer;
    }
    .mode-btn.active {
      background: var(--fire-500);
      border-color: var(--fire-500);
      color: #fff;
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
    }
    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--navy-800);
      border: 1px solid rgba(249, 115, 22, 0.45);
      color: var(--fire-500);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .brand-title { font-weight: 900; font-size: 18px; line-height: 1.1; }
    .brand-title span { color: var(--fire-500); }
    .brand-sub { font-size: 11px; color: #cbd5e1; font-weight: 600; }

    .nav-links {
      display: none;
      align-items: center;
      gap: 20px;
      font-size: 14px;
      font-weight: 700;
    }
    .nav-links a { color: #e2e8f0; text-decoration: none; }
    .nav-links a:hover { color: var(--fire-400); }
    @media (min-width: 1024px) {
      .nav-links { display: flex; }
      .mobile-toggle { display: none !important; }
    }

    .btn-fire {
      background: linear-gradient(to left, var(--fire-500), var(--fire-600));
      color: #fff;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-fire:hover { opacity: 0.95; }

    .btn-light {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .mobile-toggle {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 18px;
      cursor: pointer;
    }
    .mobile-menu {
      background: var(--navy-900);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .mobile-menu a {
      color: #fff;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
    }
    .mobile-menu a:hover { background: rgba(255, 255, 255, 0.1); }

    /* Hero */
    #public-site-shell { padding-top: 108px; }
    .hero {
      background: radial-gradient(circle at 20% 20%, rgba(249, 115, 22, 0.16), transparent 45%),
                  radial-gradient(circle at 80% 70%, rgba(30, 58, 138, 0.35), transparent 45%),
                  var(--navy-900);
      color: #fff;
      padding: 56px 0;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
      align-items: center;
    }
    @media (min-width: 1024px) {
      .hero-grid { grid-template-columns: 7fr 5fr; }
    }
    .pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(249, 115, 22, 0.15);
      border: 1px solid rgba(249, 115, 22, 0.4);
      color: var(--fire-400);
      font-size: 12px;
      font-weight: 800;
    }
    .hero h1 { font-size: 32px; font-weight: 900; margin: 14px 0 12px; line-height: 1.25; }
    @media (min-width: 768px) { .hero h1 { font-size: 46px; } }
    .hero h1 span { color: var(--fire-500); }
    .hero p { color: #cbd5e1; font-size: 16px; margin: 0 0 20px; }
    .hero-btns { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
    .hero-btns .btn-fire, .hero-btns .btn-light { padding: 12px 22px; font-size: 15px; }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(1, 1fr);
      gap: 12px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }
    @media (min-width: 640px) { .metrics-grid { grid-template-columns: repeat(3, 1fr); } }
    .metric-box {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 14px;
    }
    .metric-val { color: var(--fire-400); font-weight: 900; font-size: 20px; }
    .metric-lbl { color: #cbd5e1; font-size: 12px; font-weight: 700; margin-top: 4px; }

    .vip-card {
      background: var(--navy-800);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: 24px;
    }
    .vip-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 14px;
      margin-bottom: 16px;
    }
    .vip-tag {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }
    .pickup-box {
      background: var(--navy-950);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 14px;
      font-size: 13px;
      color: #e2e8f0;
      margin-bottom: 16px;
    }
    .wa-btn {
      width: 100%;
      background: #059669;
      color: #fff;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Sections */
    .section-white { background: #fff; padding: 64px 0; }
    .section-gray { background: var(--slate-100); padding: 64px 0; border-top: 1px solid var(--slate-200); border-bottom: 1px solid var(--slate-200); }
    .section-dark { background: var(--navy-900); color: #fff; padding: 64px 0; }

    .sec-head { text-align: center; max-width: 720px; margin: 0 auto 40px; }
    .sec-head h2 { font-size: 28px; font-weight: 900; margin: 10px 0 8px; }
    @media (min-width: 768px) { .sec-head h2 { font-size: 36px; } }
    .sec-head p { color: var(--slate-600); margin: 0; font-size: 15px; }
    .section-dark .sec-head p { color: #cbd5e1; }

    .cards-4 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 640px) { .cards-4 { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .cards-4 { grid-template-columns: repeat(4, 1fr); } }

    .service-card {
      background: var(--slate-50);
      border: 1px solid var(--slate-200);
      border-radius: 20px;
      padding: 22px;
    }
    .service-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(249, 115, 22, 0.14);
      color: var(--fire-600);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-bottom: 14px;
    }
    .service-card h3 { margin: 0 0 8px; font-size: 18px; font-weight: 800; color: var(--navy-900); }
    .service-card p { margin: 0; font-size: 14px; color: var(--slate-600); }

    .cards-3 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 1024px) { .cards-3 { grid-template-columns: repeat(3, 1fr); } }

    .rule-card {
      background: #fff;
      border: 1px solid var(--slate-200);
      border-top: 4px solid var(--navy-700);
      border-radius: 20px;
      padding: 22px;
    }
    .rule-card.orange { border-top-color: var(--fire-500); }
    .rule-card.danger {
      background: var(--navy-900);
      color: #fff;
      border: 2px solid rgba(239, 68, 68, 0.65);
      border-top-width: 2px;
    }
    .rule-card h3 { margin: 0 0 10px; font-size: 18px; font-weight: 900; }
    .rule-card p { margin: 0; font-size: 14px; color: var(--slate-600); }
    .rule-card.danger p { color: #e2e8f0; }

    /* Forms & Tracking */
    .panel-box {
      max-width: 860px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid var(--slate-200);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(11, 25, 44, 0.06);
    }
    .section-dark .panel-box {
      background: var(--navy-800);
      border-color: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    @media (min-width: 640px) { .form-row-2 { grid-template-columns: repeat(2, 1fr); } }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 800; margin-bottom: 6px; }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--slate-300);
      background: #fff;
      color: var(--navy-900);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
    }
    .section-dark .form-control {
      background: var(--navy-950);
      border-color: rgba(255, 255, 255, 0.16);
      color: #fff;
    }

    .track-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    @media (min-width: 640px) {
      .track-form { flex-direction: row; }
      .track-form .form-control { flex: 1; }
    }

    .result-card {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin: 14px 0;
    }
    @media (min-width: 640px) { .detail-grid { grid-template-columns: repeat(3, 1fr); } }
    .detail-item {
      background: var(--navy-900);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px;
    }

    /* Admin Dashboard */
    #command-center-shell {
      padding-top: 120px;
      padding-bottom: 64px;
      min-height: 85vh;
      background: var(--slate-100);
    }
    .dash-banner {
      background: var(--navy-900);
      color: #fff;
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    @media (min-width: 1024px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
    .stat-card {
      background: #fff;
      border: 1px solid var(--slate-200);
      border-radius: 18px;
      padding: 18px;
    }
    .stat-num { font-size: 26px; font-weight: 900; margin-top: 6px; }

    .table-card {
      background: #fff;
      border: 1px solid var(--slate-200);
      border-radius: 24px;
      padding: 20px;
      overflow-x: auto;
    }
    table.orders-table {
      width: 100%;
      border-collapse: collapse;
      text-align: right;
      font-size: 13px;
    }
    table.orders-table th {
      padding: 12px;
      border-bottom: 2px solid var(--slate-200);
      color: var(--slate-600);
      font-weight: 800;
      white-space: nowrap;
    }
    table.orders-table td {
      padding: 12px;
      border-bottom: 1px solid var(--slate-100);
      vertical-align: middle;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(249, 115, 22, 0.14);
      color: var(--fire-600);
      font-weight: 800;
      font-size: 12px;
    }

    /* Login Modal */
    .auth-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9998;
      background: rgba(6, 14, 26, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .auth-modal-card {
      width: 100%;
      max-width: 400px;
      background: var(--navy-900);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .auth-modal-card h3 { margin: 0 0 6px; font-size: 20px; font-weight: 900; }
    .auth-modal-card p { margin: 0 0 16px; font-size: 13px; color: #cbd5e1; }
    .auth-actions { display: flex; gap: 10px; margin-top: 16px; }

    /* Footer */
    footer.site-footer {
      background: var(--navy-950);
      color: #cbd5e1;
      padding: 28px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 14px;
    }
    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap:
